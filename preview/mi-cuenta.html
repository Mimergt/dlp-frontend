<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi cuenta: conceptos</title>
<style>
:root{--acento:#CF1E26;--tinta:#111;--gris:#f6f6f8;--linea:#e9e9ee;--mut:#8d8d96}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 70px;background:#d9d9de;font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tinta)}
h1{font-size:20px;margin:0 0 4px}p.lead{margin:0 0 24px;color:#444;font-size:14px;max-width:820px}
.wrap{display:flex;flex-wrap:wrap;gap:34px 28px;justify-content:center}.concept{width:375px}.concept.wide{width:900px}
.concept h2{font-size:14px;margin:0 0 2px}.concept .desc{font-size:12.5px;color:#555;margin:0 0 10px;min-height:52px}.meta{font-size:12px;font-weight:700;color:#333;margin-top:8px}
.phone{position:relative;width:375px;height:690px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.desk{position:relative;width:900px;height:640px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.top{height:54px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800;letter-spacing:.04em;font-size:14px}
.body{position:absolute;top:54px;left:0;right:0;bottom:0;overflow-y:auto;padding:14px 14px 96px;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.hello{font-size:19px;font-weight:800;margin:2px 0 2px}.sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.pills{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}.pills b{flex:none;padding:8px 14px;border:1px solid var(--linea);border-radius:999px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#777;cursor:pointer}.pills b.on{border-color:#111;box-shadow:0 0 0 1px #111;color:#111}
.card{border:1px solid var(--linea);border-radius:18px;padding:14px;margin-bottom:10px;background:#fff}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.num{font-weight:800;font-size:13.5px}.dt{color:var(--mut);font-size:11.5px}.items{font-size:12.5px;color:#55555e;margin:8px 0}.tot{font-weight:800}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700}.ok{background:#e7f6ec;color:#17803d}.go{background:#fef3c7;color:#92400e}.no{background:#fee2e2;color:#b91c1c}
.acts{display:flex;gap:8px;margin-top:10px}.btn{flex:1;text-align:center;padding:9px 6px;border-radius:999px;border:1.5px solid #111;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;background:#fff}.btn.fill{background:#111;color:#fff}.btn.red{border-color:var(--acento);color:var(--acento)}
.f{margin-bottom:10px}.f label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#55555e;margin:0 0 4px 2px}.f div{height:42px;border:1px solid var(--linea);border-radius:12px;background:#fcfcfd;padding:0 12px;display:flex;align-items:center;font-size:13px}
.addr b{font-size:13.5px}.addr .a{font-size:12.5px;color:#55555e;margin-top:3px}.addr .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid var(--linea);border-radius:18px;padding:16px 14px;cursor:pointer;background:#fff}.tile i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--gris);margin-bottom:12px;font-style:normal;font-size:18px}.tile b{display:block;font-size:13.5px}.tile small{color:var(--mut);font-size:11.5px}
.list .it{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--linea);cursor:pointer}.list .it i{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--gris);font-style:normal}.list .it span{flex:1;font-weight:700;font-size:14px}.list .it u{text-decoration:none;color:#c4c4cc;font-size:18px}.list .it.out span{color:#b91c1c}
.nav{display:flex;align-items:center;gap:10px;margin:0 0 14px}.nav .back{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--linea);border-radius:50%;cursor:pointer}.nav b{font-size:16px}
.logout{margin-top:14px;text-align:center;padding:11px;border:1.5px solid #e9e9ee;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#b91c1c;cursor:pointer}
.dk{display:grid;grid-template-columns:230px 1fr;height:586px}.side{border-right:1px solid var(--linea);padding:20px 14px;display:flex;flex-direction:column;gap:4px}.av{width:54px;height:54px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;margin:0 0 8px}.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:600;color:#55555e;cursor:pointer}.side a.on{background:var(--gris);color:#111;font-weight:800}.side .sp{flex:1}.main{padding:22px 26px;overflow-y:auto}.main h3{margin:0 0 14px;font-size:18px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hide{display:none}
</style></head><body>
<h1>Mi cuenta: 4 conceptos</h1>
<p class="lead">Solo lo necesario: <b>Pedidos</b>, <b>Direcciones</b>, <b>Perfil</b> y <b>Salir</b>. Cada celular es interactivo: toca las opciones para cambiar de pantalla. Los datos son de ejemplo. Direcciones muestra la libreta de 3 como en el checkout.</p>
<div class="wrap" id="wrap"></div>
<script>
var pedidos='<div class="card"><div class="row"><div><div class="num">Pedido #54321</div><div class="dt">3 oct 2026 · Delivery · Calle Martí</div></div><span class="chip go">En camino</span></div><div class="items">Felices los 4 ×1<br>Papas Fritas X 3 ×1</div><div class="row"><span class="dt">2 productos</span><span class="tot">Q235.00</span></div><div class="acts"><span class="btn">Ver detalle</span><span class="btn red">Seguir pedido</span></div></div>'+
'<div class="card"><div class="row"><div><div class="num">Pedido #54102</div><div class="dt">28 sep 2026 · Pickup · Majadas</div></div><span class="chip ok">Entregado</span></div><div class="items">Trío de Clásicas ×1</div><div class="row"><span class="dt">1 producto</span><span class="tot">Q155.00</span></div><div class="acts"><span class="btn">Ver detalle</span><span class="btn fill">Pedir de nuevo</span></div></div>'+
'<div class="card"><div class="row"><div><div class="num">Pedido #53877</div><div class="dt">21 sep 2026 · Delivery</div></div><span class="chip no">Cancelado</span></div><div class="items">Tender Box 24 Unidades ×1</div><div class="row"><span class="dt">1 producto</span><span class="tot">Q163.00</span></div></div>';
function addr(n,a,s,ok,msg){return '<div class="card addr"><div class="row"><div><b>'+n+'</b> <span class="chip '+(ok?'ok':'no')+'">'+(ok?'Abierta':'Cerrada')+'</span><div class="a">'+a+'</div><div class="s">'+s+'</div>'+(ok?'':'<div class="s" style="color:#b91c1c;margin-top:5px">'+msg+'</div>')+'</div><span class="dt" style="cursor:pointer">Eliminar</span></div></div>';}
var dirs='<div class="dt" style="margin:0 0 10px">2 de 3 direcciones guardadas</div>'+addr('Casa','12 ave 3-22 zona 1 · portón negro','San Cristóbal, Mixco',false,'Fuera de horario de delivery. Horario de hoy: 11:00 a 20:45.')+addr('Trabajo','Calle Martí, edificio B','Calle Martí',true)+'<div class="btn fill" style="margin-top:4px">+ Agregar dirección</div><p class="dt" style="margin-top:10px">Para agregar una, marca el punto en el mapa. También puedes guardarla al hacer un pedido.</p>';
function f(l,v){return '<div class="f"><label>'+l+'</label><div>'+v+'</div></div>'}
var perfil='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+f('Nombre','Mimer')+f('Apellido','Calderón')+'</div>'+f('Teléfono','4166 8314')+f('Correo electrónico','mimer@edngt.com')+f('Nombre para la factura','Elmer Calderón')+f('NIT','47653191')+'<div class="btn fill">Guardar cambios</div><div class="btn" style="margin-top:8px">Cambiar contraseña</div>';
var V={pedidos:['Pedidos',pedidos],dirs:['Direcciones',dirs],perfil:['Perfil',perfil]};
var hdr='<div class="top"><span>DEL PUENTE</span><span style="opacity:.7;font-weight:600;font-size:11px">Mi cuenta</span></div>';
var wrap=document.getElementById('wrap');
function mk(cls,t,d,m,html,wide){var e=document.createElement('div');e.className='concept'+(wide?' wide':'');e.innerHTML='<h2>'+t+'</h2><p class="desc">'+d+'</p><div class="'+(wide?'desk':'phone')+'">'+html+'</div><div class="meta">'+m+'</div>';wrap.appendChild(e);return e;}
// 1 pestañas
var e1=mk('c1','1 · Pestañas arriba','Saludo y tres pestañas tipo píldora (como las categorías). Cerrar sesión como botón discreto al final.','Una sola pantalla · lo más rápido',hdr+'<div class="body"><div class="hello">Hola, Mimer</div><div class="sub">mimer@edngt.com</div><div class="pills"><b data-v="pedidos" class="on">Pedidos</b><b data-v="dirs">Direcciones</b><b data-v="perfil">Perfil</b></div><div class="view">'+pedidos+'</div><div class="logout">Cerrar sesión</div></div>');
e1.querySelectorAll('.pills b').forEach(function(b){b.onclick=function(){e1.querySelectorAll('.pills b').forEach(function(x){x.classList.remove('on')});b.classList.add('on');e1.querySelector('.view').innerHTML=V[b.dataset.v][1]}});
// 2 tarjetas
var e2=mk('c2','2 · Tarjetas de acceso','Pantalla de inicio con cuatro tarjetas grandes. Al tocar una se abre con flecha para regresar.','Inicio visual · 2 toques por sección',hdr+'<div class="body"><div class="hello">Hola, Mimer</div><div class="sub">¿Qué quieres hacer?</div><div class="dash"><div class="tile" data-v="pedidos"><i>🧾</i><b>Pedidos</b><small>3 pedidos</small></div><div class="tile" data-v="dirs"><i>📍</i><b>Direcciones</b><small>2 de 3</small></div><div class="tile" data-v="perfil"><i>👤</i><b>Perfil</b><small>Datos y factura</small></div><div class="tile"><i>↩︎</i><b style="color:#b91c1c">Salir</b><small>Cerrar sesión</small></div></div><div class="card" style="margin-top:12px"><div class="row"><div><div class="num">Último pedido #54321</div><div class="dt">En camino · Q235.00</div></div><span class="chip go">En camino</span></div></div></div>');
var h2=e2.querySelector('.body').innerHTML;
function bind2(){e2.querySelectorAll('.tile[data-v]').forEach(function(t){t.onclick=function(){var v=V[t.dataset.v];e2.querySelector('.body').innerHTML='<div class="nav"><span class="back">‹</span><b>'+v[0]+'</b></div>'+v[1];e2.querySelector('.back').onclick=function(){e2.querySelector('.body').innerHTML=h2;bind2()}}})}bind2();
// 3 lista
var e3=mk('c3','3 · Lista tipo ajustes','Filas con ícono y flecha, como la app de Ajustes. Salir queda como última fila en rojo.','Más compacto · muy claro en celular',hdr+'<div class="body"><div class="hello">Hola, Mimer</div><div class="sub">mimer@edngt.com</div><div class="list"><div class="it" data-v="pedidos"><i>🧾</i><span>Pedidos</span><u>›</u></div><div class="it" data-v="dirs"><i>📍</i><span>Direcciones</span><u>›</u></div><div class="it" data-v="perfil"><i>👤</i><span>Perfil</span><u>›</u></div><div class="it out"><i>↩︎</i><span>Cerrar sesión</span></div></div></div>');
var h3=e3.querySelector('.body').innerHTML;
function bind3(){e3.querySelectorAll('.it[data-v]').forEach(function(t){t.onclick=function(){var v=V[t.dataset.v];e3.querySelector('.body').innerHTML='<div class="nav"><span class="back">‹</span><b>'+v[0]+'</b></div>'+v[1];e3.querySelector('.back').onclick=function(){e3.querySelector('.body').innerHTML=h3;bind3()}}})}bind3();
// 4 escritorio
var e4=mk('c4','4 · Escritorio: menú lateral','En computadora: columna izquierda con avatar y opciones, contenido a la derecha. Salir al final de la columna.','≥ 1024 px · acompaña a cualquiera de los de celular','<div class="top" style="padding:0 28px"><span>DEL PUENTE</span><span style="opacity:.7;font-weight:600;font-size:11px">Mi cuenta</span></div><div class="dk"><div class="side"><div class="av">M</div><b style="margin:0 0 12px;font-size:14px">Mimer Calderón</b><a class="on" data-v="pedidos">🧾 Pedidos</a><a data-v="dirs">📍 Direcciones</a><a data-v="perfil">👤 Perfil</a><span class="sp"></span><a style="color:#b91c1c">↩︎ Cerrar sesión</a></div><div class="main"><h3>Pedidos</h3><div class="g2">'+pedidos+'</div></div></div>',true);
e4.querySelectorAll('.side a[data-v]').forEach(function(a){a.onclick=function(){e4.querySelectorAll('.side a').forEach(function(x){x.classList.remove('on')});a.classList.add('on');var v=V[a.dataset.v];e4.querySelector('.main').innerHTML='<h3>'+v[0]+'</h3>'+(a.dataset.v==='pedidos'?'<div class="g2">'+v[1]+'</div>':'<div style="max-width:480px">'+v[1]+'</div>')}});
</script></body></html>
