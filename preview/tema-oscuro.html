<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mockup: claro y oscuro</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px 18px 60px;background:#d9d9de;font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#111}
h1{font-size:20px;margin:0 0 4px}p.lead{margin:0 0 14px;color:#444;font-size:14px;max-width:760px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}.bar b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#555;margin-right:2px}
.bar button{border:1px solid #bbb;background:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer}.bar button.on{background:#111;color:#fff;border-color:#111}.bar .sp{width:14px}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#555;margin:18px 0 8px}
.row{display:flex;gap:22px;overflow-x:auto;padding:4px 4px 18px}
.cap{font-size:11px;font-weight:700;color:#555;text-align:center;margin:8px 0 0;text-transform:uppercase;letter-spacing:.04em}
/* paletas */
.ph{--bg:#fff;--surf:#f6f6f8;--card:#fff;--tx:#111;--mut:#8d8d96;--line:#e9e9ee;--fld:#fcfcfd;--btn:#111;--btnt:#fff;--ac:#CF1E26;--ok:#17803d;--hero:#000;--herot:#fff;--sheet:#fff;--nav:#fff;--navb:#e9e9ee;--chip:#efeff2;--shadow:0 6px 18px rgba(0,0,0,.12)}
.ph.dark{--bg:#000;--surf:#0d0d0f;--card:#121214;--tx:#f4f4f5;--mut:#8f8f98;--line:#26262b;--fld:#18181b;--btn:#fff;--btnt:#111;--ac:#E8434A;--ok:#30c25f;--hero:#000;--herot:#fff;--sheet:#121214;--nav:#161619;--navb:#2a2a30;--chip:#1f1f24;--shadow:0 6px 18px rgba(0,0,0,.6)}
body.carbon .ph.dark{--bg:#121214;--surf:#1a1a1d;--card:#1e1e22;--line:#2f2f36;--fld:#26262b;--sheet:#1e1e22;--nav:#222226;--navb:#34343b;--chip:#2a2a30;--hero:#0c0c0e}
.ph{position:relative;flex:0 0 300px;width:300px;height:620px;background:var(--bg);color:var(--tx);border-radius:30px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);border:1px solid #0002;font-size:12px}
.ph.dark{border-color:#333}
.sb{height:26px;display:flex;justify-content:space-between;padding:8px 20px 0;font-size:10.5px;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 8px}
.logo{font-weight:900;font-size:15px;letter-spacing:-.02em}.logo small{display:block;font-size:6px;letter-spacing:.2em;font-weight:600;margin-top:-2px}
.burg{width:18px;height:12px;border-top:2px solid var(--tx);border-bottom:2px solid var(--tx);position:relative}.burg::after{content:"";position:absolute;left:0;right:0;top:3px;border-top:2px solid var(--tx)}
.pills{display:flex;gap:6px;padding:4px 14px 10px;overflow:hidden}
.pill{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:11px;color:var(--tx);background:var(--bg)}.pill.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.pr{display:flex;gap:10px;margin:0 14px 10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.im{flex:0 0 74px;height:74px;border-radius:12px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#ffd9a0,#f08a4b)}
.pr b{display:block;font-size:13px}.pr span{display:block;color:var(--mut);font-size:10.5px;margin:2px 0 6px;line-height:1.35}.pr em{font-style:normal;font-weight:800;font-size:13px}
.add{margin-left:auto;align-self:end;width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--btnt);display:grid;place-items:center;font-weight:800;font-size:16px}
.nav{position:absolute;left:14px;right:14px;bottom:14px;height:56px;border-radius:999px;background:var(--nav);border:1px solid var(--navb);box-shadow:var(--shadow);display:flex;justify-content:space-around;align-items:center;font-size:8.5px;font-weight:700;color:var(--mut)}
.nav i{display:block;font-style:normal;text-align:center}.nav i.on{color:var(--tx)}.nav u{display:block;font-size:15px;text-decoration:none;margin-bottom:1px}
.nav .bd{position:relative}.nav .bd::after{content:"2";position:absolute;top:-4px;right:-8px;background:var(--ac);color:#fff;border-radius:99px;font-size:8px;padding:1px 5px}
.hero{height:230px;display:grid;place-items:center;font-size:90px;background:linear-gradient(135deg,#ffd9a0,#f08a4b)}
.pad{padding:14px 16px}.h2{font-size:18px;font-weight:800;margin:0 0 3px}.mut{color:var(--mut)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--card)}
.opt.sel{border-color:var(--tx)}.rad{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.opt.sel .rad{border:5px solid var(--tx)}
.cta{position:absolute;left:14px;right:14px;bottom:16px;height:48px;border-radius:999px;background:var(--btn);color:var(--btnt);display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:11.5px}
.cta.r{background:var(--ac);color:#fff}
.card{margin:0 14px 10px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.card h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.fld{height:38px;border:1px solid var(--line);border-radius:11px;background:var(--fld);margin-top:6px;padding:0 11px;display:flex;align-items:center;color:var(--mut);font-size:11.5px}.fld.v{color:var(--tx)}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}.seg div{flex:1;text-align:center;padding:8px;border-radius:999px;font-weight:700;font-size:11px;color:var(--mut)}.seg div.on{background:var(--btn);color:var(--btnt)}
.tabs{display:flex;gap:6px;padding:4px 14px 10px}.tabs .pill{display:flex;align-items:center;gap:5px}
.ord{margin:0 14px 10px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.ord .t{display:flex;justify-content:space-between;font-weight:800;font-size:13px}.tag{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.tag.p{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.ord .m{color:var(--mut);margin-top:4px;font-size:11px}
/* gracias */
.gh{background:var(--hero);color:var(--herot);height:240px;text-align:center;padding-top:6px}
.gh .disc{width:92px;height:92px;border-radius:50%;background:#f4f4f6;margin:8px auto 8px;display:grid;place-items:center;font-size:46px;border:2px solid #2a2a2a}
.gh h3{margin:0 0 3px;font-size:19px}.gh p{margin:0;color:#b4b4bc;font-size:11px}
.gs{position:absolute;top:230px;left:0;right:0;bottom:0;background:var(--sheet);border-radius:24px 24px 0 0;padding:18px 14px;border-top:1px solid var(--line)}
.steps{display:flex;justify-content:space-between}.st{width:25%;text-align:center;font-size:8px;font-weight:800;text-transform:uppercase;color:var(--mut)}.st i{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 5px;border-radius:50%;background:var(--chip);font-style:normal;font-size:16px}
.st.d{color:var(--tx)}.st.d i{background:var(--ok);color:#fff}.st.n{color:var(--tx)}.st.n i{background:var(--ac);color:#fff}
.btn{height:44px;border-radius:999px;background:var(--btn);color:var(--btnt);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-top:9px}.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--line)}
.sheet-login{position:absolute;top:210px;left:0;right:0;bottom:0;background:var(--sheet);border-radius:24px 24px 0 0;padding:20px 16px;border-top:1px solid var(--line)}
</style></head><body>
<h1>Mockup: versión clara y oscura</h1>
<p class="lead">Arriba, el sitio como lo vería un iPhone en modo claro; abajo, en modo oscuro. Elige el tono del oscuro (negro puro o carbón) y mira cómo quedan home, producto, pago, Mi cuenta y gracias. Los colores son de ejemplo.</p>
<div class="bar"><b>Oscuro</b><button data-p="negro" class="on">Negro puro</button><button data-p="carbon">Carbón</button><span class="sp"></span><b>Ver</b><button data-v="both" class="on">Ambos</button><button data-v="light">Solo claro</button><button data-v="dark">Solo oscuro</button></div>
<div class="lbl" data-r="light">Modo claro</div><div class="row" data-r="light" id="rl"></div>
<div class="lbl" data-r="dark">Modo oscuro</div><div class="row" data-r="dark" id="rd"></div>
<script>
var nav=function(a){return '<div class="nav"><i class="'+(a==0?'on':'')+'"><u>🍔</u>Menú</i><i><u>📍</u>Ubicaciones</i><i class="'+(a==2?'on':'')+'"><u>👤</u>Cuenta</i><i class="bd"><u>🛒</u>Carrito</i></div>'};
var sb='<div class="sb"><span>9:41</span><span>●●● 100%</span></div>';
var S=[
 ['Home',function(){return sb+'<div class="hd"><div class="logo">DelPuente<small>HAMBURGUESAS</small></div><div class="burg"></div></div><div class="pills"><div class="pill on">Hamburguesas</div><div class="pill">Combos</div><div class="pill">Pollo</div><div class="pill">Postres</div></div>'+
  [['Del Puente Clásica','Carne 1/4 lb, queso, lechuga y tomate','Q45.00','🍔'],['Doble Queso','Doble carne, doble queso cheddar','Q58.00','🧀'],['Papas Fritas','Porción grande con salsa','Q25.00','🍟']].map(function(p){return '<div class="pr"><div class="im">'+p[3]+'</div><div><b>'+p[0]+'</b><span>'+p[1]+'</span><em>'+p[2]+'</em></div><div class="add">+</div></div>'}).join('')+nav(0)}],
 ['Producto',function(){return '<div class="hero">🍔</div><div class="pad"><div class="h2">Del Puente Clásica</div><div class="mut">Carne 1/4 lb, queso, lechuga y tomate</div><div class="opt sel"><span>Sin extras</span><span class="rad"></span></div><div class="opt"><span>Extra tocino <b>+Q8</b></span><span class="rad"></span></div><div class="opt"><span>Extra queso <b>+Q5</b></span><span class="rad"></span></div></div><div class="cta">Agregar · Q45.00</div>'}],
 ['Pago',function(){return sb+'<div class="hd"><b style="font-size:15px">Finalizar compra</b><span class="mut">‹ Volver</span></div><div class="card"><div class="seg"><div class="on">Delivery</div><div>Pickup</div></div><div class="fld v">📍 Calle Martí, zona 1</div><div class="fld">Referencia</div></div><div class="card"><h4>Tus datos</h4><div class="fld v">Mimer</div><div class="fld v">5555 0000</div><div class="fld">Correo</div></div><div class="card"><h4>Pago</h4><div class="opt sel" style="margin:0"><span>Efectivo al recibir</span><span class="rad"></span></div></div><div class="cta r">Realizar pedido · Q75.00</div>'}],
 ['Mi cuenta',function(){return sb+'<div class="hd"><b style="font-size:17px">Mi cuenta</b></div><div class="tabs"><div class="pill on">Pedidos</div><div class="pill">Direcciones</div><div class="pill">Perfil</div></div><div class="ord"><div class="t"><span>#158809</span><span class="tag">Entregado</span></div><div class="m">6 oct · Q75.00 · Calle Martí</div></div><div class="ord"><div class="t"><span>#158790</span><span class="tag p">Preparando</span></div><div class="m">5 oct · Q58.00 · Pickup</div></div><div class="ord"><div class="t"><span>#158744</span><span class="tag">Entregado</span></div><div class="m">1 oct · Q103.00</div></div>'+nav(2)}],
 ['Gracias',function(){return '<div class="gh">'+sb.replace('<div class="sb">','<div class="sb" style="color:#fff">')+'<div class="disc">🍔</div><h3>¡Gracias, Mimer!</h3><p>Recibimos tu pedido #158809<br>Sale de Calle Martí</p></div><div class="gs"><div class="steps"><div class="st d"><i>✓</i>Recibido</div><div class="st n"><i>🍲</i>Preparando</div><div class="st"><i>🛵</i>En camino</div><div class="st"><i>🏠</i>Entregado</div></div><div class="card" style="margin:12px 0 0"><div style="display:flex;justify-content:space-between;padding:3px 0"><span class="mut">Total</span><b>Q75.00</b></div><div style="display:flex;justify-content:space-between;padding:3px 0"><span class="mut">Pago</span><b>Efectivo</b></div></div><div class="btn">Ver mi pedido</div><div class="btn o">Seguir pidiendo</div></div>'}]
];
function build(id,cls){document.getElementById(id).innerHTML=S.map(function(s){return '<div><div class="ph '+cls+'">'+s[1]()+'</div><div class="cap">'+s[0]+'</div></div>'}).join('')}
build('rl','');build('rd','dark');
document.querySelector('.bar').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.p){document.body.classList.toggle('carbon',b.dataset.p=='carbon')}
 if(b.dataset.v){document.querySelectorAll('[data-r]').forEach(function(x){x.style.display=(b.dataset.v=='both'||x.dataset.r==b.dataset.v)?'':'none'})}
 this.querySelectorAll('button').forEach(function(x){if(('p' in b.dataset&&'p' in x.dataset)||('v' in b.dataset&&'v' in x.dataset))x.classList.toggle('on',x===b)})};
</script></body></html>
