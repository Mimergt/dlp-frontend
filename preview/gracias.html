<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pedido recibido: mezcla</title>
<style>
:root{--acento:#CF1E26;--tinta:#111;--gris:#f6f6f8;--linea:#e9e9ee;--mut:#8d8d96;--ok:#17803d}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 70px;background:#d9d9de;font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tinta)}
h1{font-size:20px;margin:0 0 4px}p.lead{margin:0 0 18px;color:#444;font-size:14px;max-width:820px}
.wrap{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;align-items:flex-start}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;max-width:375px}.ctl button{border:1px solid #bbb;background:#fff;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer}.ctl button.on{background:#111;color:#fff;border-color:#111}.ctl .sp{flex-basis:100%;height:0}
.phone{position:relative;width:375px;height:720px;background:#000;border-radius:26px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.28);color:#fff}
.top{height:54px;display:flex;align-items:center;padding:0 16px;font-weight:800;letter-spacing:.04em;font-size:14px;border-bottom:1px solid #151515}
.hero{position:absolute;top:54px;left:0;right:0;height:300px;text-align:center;padding-top:6px}
.scene{width:200px;height:150px;margin:0 auto}
.t{font-size:24px;font-weight:800;margin:0 0 4px}.s{color:#b4b4bc;font-size:13px;line-height:1.45;margin:0 22px}.s b{color:#fff}
.sheet{position:absolute;top:340px;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:22px 16px;color:#111}
/* barra de estados */
.steps{display:flex;justify-content:space-between;position:relative;margin:2px 2px 6px}
.steps::before{content:"";position:absolute;left:12%;right:12%;top:24px;height:3px;background:var(--linea)}
.steps .fill{position:absolute;left:12%;top:24px;height:3px;background:var(--ok);width:0;transition:width .6s ease}
.st{position:relative;z-index:1;width:25%;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
.ic{display:grid;place-items:center;width:50px;height:50px;margin:0 auto 7px;border-radius:50%;background:#efeff2;position:relative}
.ic svg{width:26px;height:26px;fill:none;stroke:#a3a3ac;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.st.done{color:var(--tinta)}.st.done .ic{background:var(--ok)}.st.done .ic svg{stroke:#fff}
.st.now{color:var(--tinta)}.st.now .ic{background:var(--acento);animation:pulse 1.6s infinite}.st.now .ic svg{stroke:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(207,30,38,.45)}100%{box-shadow:0 0 0 14px rgba(207,30,38,0)}}
/* animaciones de íconos */
.st.done.first .ic{animation:pop .5s ease}@keyframes pop{50%{transform:scale(1.18)}}
.st.now .flame{transform-origin:50% 100%;animation:flick .6s infinite alternate ease-in-out}@keyframes flick{from{transform:scaleY(.92) rotate(-3deg)}to{transform:scaleY(1.08) rotate(3deg)}}
.st.now .steam{stroke-dasharray:6;animation:steam 1.2s linear infinite}@keyframes steam{to{stroke-dashoffset:-12}}
.st.now .moto{animation:ride .9s infinite alternate ease-in-out}@keyframes ride{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.st.now .wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.st.now .bag{animation:bob 1s infinite alternate ease-in-out}@keyframes bob{from{transform:translateY(1.5px)}to{transform:translateY(-1.5px)}}
.st.now .home{animation:pop 1s infinite}
/* escena hamburguesa cocinando */
.sc{width:100%;height:100%}
.patty{transform-origin:100px 78px;animation:flip 2.2s infinite ease-in-out}
@keyframes flip{0%,55%{transform:translateY(0) rotate(0)}70%{transform:translateY(-46px) rotate(180deg)}85%{transform:translateY(-8px) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
.wisp{fill:none;stroke:#9a9aa3;stroke-width:3;stroke-linecap:round;opacity:0;animation:wisp 2s infinite}
.wisp.b{animation-delay:.6s}.wisp.c{animation-delay:1.2s}
@keyframes wisp{0%{opacity:0;transform:translateY(8px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-22px)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s infinite alternate ease-in-out}.fl.b{animation-delay:.15s}.fl.c{animation-delay:.3s}
.spark{fill:#ffcf5c;opacity:0;animation:spark 1.1s infinite}.spark.b{animation-delay:.35s}.spark.c{animation-delay:.7s}
@keyframes spark{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(var(--x),-26px)}}
.card{border:1px solid var(--linea);border-radius:18px;padding:12px 14px;margin:10px 0 0}
.row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}.row span{color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:999px;background:#111;color:#fff;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-top:10px}.btn.o{background:#fff;color:#111;border:1.5px solid #e9e9ee}.btn.r{background:var(--acento)}
</style></head><body>
<h1>Pedido recibido: mezcla</h1>
<p class="lead">Fondo negro arriba con la hamburguesa cocinándose, hoja blanca abajo con la barra de estados (con íconos animados). Cambia entre Delivery y Pickup y entre los estados para ver cada animación. Los estados y tiempos son de ejemplo.</p>
<div class="wrap"><div>
<div class="ctl" id="c1"><button data-k="t" data-v="d" class="on">Delivery</button><button data-k="t" data-v="p">Pickup</button><span class="sp"></span><button data-k="s" data-v="0">Recibido</button><button data-k="s" data-v="1" class="on">Preparando</button><button data-k="s" data-v="2">En camino / Listo</button><button data-k="s" data-v="3">Entregado</button></div>
<div class="phone" id="ph"></div></div></div>
<script>
var I={
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 11l2 2 4-4"/>',
 cook:'<path class="steam" d="M9 6c-1-1.2 1-2.2 0-3.4M13 6c-1-1.2 1-2.2 0-3.4M17 6c-1-1.2 1-2.2 0-3.4"/><path d="M4 11h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-2Z"/><path d="M20 12h2"/>',
 flame:'<path class="flame" d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9Z"/>',
 moto:'<g class="moto"><circle class="wheel" cx="6" cy="17" r="2.5"/><circle class="wheel" cx="18" cy="17" r="2.5"/><path d="M6 17h5l3-7h3l1 7M10 10h4M13 8h3"/></g>',
 bag:'<g class="bag"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></g>',
 home:'<g class="home"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5v-5h4v5"/></g>',
 smile:'<g class="home"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c1 1.6 2.2 2.2 3.5 2.2s2.5-.6 3.5-2.2M9 9.5h.01M15 9.5h.01"/></g>'
};
var scene='<svg class="sc" viewBox="0 0 200 150"><g class="fl"><path d="M70 118c4-8 0-12 4-20 2 6 8 8 6 20z" fill="#CF1E26"/></g><g class="fl b"><path d="M92 120c4-10-1-14 5-24 3 8 9 10 6 24z" fill="#ff7a2f"/></g><g class="fl c"><path d="M114 118c4-8 0-12 4-20 2 6 8 8 6 20z" fill="#CF1E26"/></g><ellipse cx="100" cy="92" rx="58" ry="10" fill="#2a2a2a"/><path d="M42 86h116l-8 8H50z" fill="#1c1c1c"/><rect x="150" y="84" width="40" height="7" rx="3.5" fill="#333"/><g class="patty"><ellipse cx="100" cy="78" rx="34" ry="9" fill="#7a3b1d"/><ellipse cx="100" cy="75" rx="34" ry="8" fill="#9a4f26"/><path d="M80 74c6 2 10 2 16 0M100 78c6 2 12 2 18-1" stroke="#5a2a12" stroke-width="2" fill="none" stroke-linecap="round"/></g><path class="wisp" d="M86 58c-4-6 4-10 0-16"/><path class="wisp b" d="M102 54c-4-6 4-10 0-16"/><path class="wisp c" d="M118 58c-4-6 4-10 0-16"/><circle class="spark" cx="78" cy="84" r="2.4" style="--x:-8px"/><circle class="spark b" cx="122" cy="84" r="2.2" style="--x:10px"/><circle class="spark c" cx="100" cy="86" r="2" style="--x:0px"/></svg>';
var st={t:'d',s:1};
function steps(){
  var p=st.t=='p';
  var L=[['Recibido','receipt'],['Preparando','cook'],[p?'Listo':'En camino',p?'bag':'moto'],[p?'Recogido':'Entregado',p?'smile':'home']];
  var h='<div class="steps"><div class="fill" style="width:'+(st.s*25.3)+'%"></div>';
  L.forEach(function(x,i){var c=i<st.s?'done':(i==st.s?'now':'');if(i==0&&st.s>0)c+=' first';
    var ic=i==1&&i==st.s?I.cook:I[x[1]];
    h+='<div class="st '+c+'"><div class="ic"><svg viewBox="0 0 24 24">'+ic+'</svg></div>'+x[0]+'</div>'});
  return h+'</div>';
}
function draw(){
  var p=st.t=='p',eta=p?'Listo en ~20 min · Calle Martí':'Llega en ~35 min · Calle Martí';
  var titles=['¡Gracias, Mimer!','¡Gracias, Mimer!',p?'¡Tu pedido está listo!':'¡Tu pedido va en camino!','¡Buen provecho!'];
  document.getElementById('ph').innerHTML='<div class="top">DEL PUENTE</div><div class="hero"><div class="scene">'+scene+'</div><div class="t">'+titles[st.s]+'</div><p class="s">Recibimos tu pedido <b>#158810</b>.<br>'+eta+'</p></div><div class="sheet">'+steps()+'<div class="card"><div class="row"><span>Total</span><b>Q'+(p?'71.00':'86.00')+'</b></div><div class="row"><span>Pago</span><b>Efectivo '+(p?'en la tienda':'al recibir')+'</b></div></div>'+(p&&st.s==2?'<div class="btn r">Ya estoy aquí por mi pedido</div>':'')+'<div class="btn">Ver mi pedido</div><div class="btn o">Seguir pidiendo</div></div>';
}
document.getElementById('c1').onclick=function(e){var b=e.target.closest('button');if(!b)return;st[b.dataset.k]=b.dataset.k=='s'?+b.dataset.v:b.dataset.v;this.querySelectorAll('button').forEach(function(x){if(x.dataset.k==b.dataset.k)x.classList.toggle('on',x===b)});draw()};
draw();
</script></body></html>
